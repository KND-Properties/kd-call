<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>K&amp;D Call</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#F5F2F5;color:#1E1A1F;text-align:center;padding:24px;box-sizing:border-box}
a.call{display:inline-block;background:#5E2C5E;color:#fff;text-decoration:none;font-size:22px;font-weight:600;padding:18px 34px;border-radius:999px;margin:18px 0}
p{color:#6A6170;margin:6px 0}
</style>
</head>
<body>
<main>
  <p id="msg">Calling…</p>
  <a class="call" id="btn" href="#">Call</a>
  <p><button id="close" type="button" hidden onclick="window.close()" style="border:1px solid #E7E0E7;background:#fff;color:#5E2C5E;font:inherit;font-weight:600;padding:10px 22px;border-radius:999px">Close this page</button></p>
  <p>If it stays open, swipe it away or go back to the Daily Desk.</p>
</main>
<script>
// The number travels after the # so it is never sent to the web host.
var n = decodeURIComponent(location.hash.slice(1)).replace(/[^\d+]/g, "");
var btn = document.getElementById("btn");
if (n) {
  var shown = n.replace(/^\+61/, "0").replace(/^(\d{4})(\d{3})(\d{3})$/, "$1 $2 $3");
  btn.href = "tel:" + n;
  btn.textContent = "Call " + shown;
  location.href = "tel:" + n;
  // Close this tab once you come back from the call (or cancel the prompt).
  // Browsers only allow this for tabs that were opened by another page, so it may not always work.
  var left = false;
  function tryClose() { try { window.close(); } catch (e) {} }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) left = true;
    else if (left) setTimeout(tryClose, 300);
  });
  window.addEventListener("blur", function () { left = true; });
  window.addEventListener("focus", function () { if (left) setTimeout(tryClose, 300); });
  document.getElementById("close").hidden = false;
} else {
  document.getElementById("msg").textContent = "No phone number was passed to this page.";
  btn.hidden = true;
}
</script>
</body>
</html>
